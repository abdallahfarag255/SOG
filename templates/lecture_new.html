<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إضافة محاضرة</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 16px; max-width: 700px; margin-inline: auto; }
        .flash { background: #fff3cd; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .back-link { display: inline-block; margin-bottom: 10px; color: #555; font-size: 13px; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input[type="date"] { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .attendee-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .attendee-row input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .remove-row-btn {
            background: #e53935; color: #fff; border: none; border-radius: 6px;
            width: 36px; cursor: pointer; font-size: 16px;
        }
        .add-row-btn {
            background: #eee; border: 1px solid #ddd; border-radius: 6px;
            padding: 8px 14px; cursor: pointer; margin-top: 6px;
        }
        .save-btn {
            background: #2e7d32; color: #fff; border: none; border-radius: 6px;
            padding: 12px 16px; width: 100%; margin-top: 20px; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>
    <a href="{{ url_for('riders') }}" class="back-link">&rarr; رجوع</a>
    <h1>إضافة محاضرة</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <label for="lecture_date">تاريخ المحاضرة</label>
        <input type="date" id="lecture_date" name="lecture_date" required>

        <label>الأسماء والـ zone</label>
        <div id="attendeesContainer">
            <div class="attendee-row">
                <input type="text" name="attendee_name" placeholder="الاسم" required>
                <input type="text" name="attendee_zone" placeholder="Zone">
                <button type="button" class="remove-row-btn" onclick="removeRow(this)">&times;</button>
            </div>
        </div>
        <button type="button" class="add-row-btn" onclick="addRow()">+ إضافة اسم تاني</button>

        <button type="submit" class="save-btn">حفظ المحاضرة</button>
    </form>

    <script>
        function addRow() {
            var container = document.getElementById('attendeesContainer');
            var row = document.createElement('div');
            row.className = 'attendee-row';
            row.innerHTML =
                '<input type="text" name="attendee_name" placeholder="الاسم">' +
                '<input type="text" name="attendee_zone" placeholder="Zone">' +
                '<button type="button" class="remove-row-btn" onclick="removeRow(this)">&times;</button>';
            container.appendChild(row);
        }

        function removeRow(button) {
            var container = document.getElementById('attendeesContainer');
            if (container.children.length > 1) {
                button.closest('.attendee-row').remove();
            }
        }
    </script>
</body>
</html>
